version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db  # DB_HOST points to the MySQL service name
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: luong_thuc_viet

  db:
    image: mysql:8.0
    container_name: mysql_container
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db"]  # Use the service name "db" for health check
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: luong_thuc_viet
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

